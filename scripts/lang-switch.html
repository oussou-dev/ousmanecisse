<script>
    document.addEventListener("DOMContentLoaded", function () {
        const langLinks = document.querySelectorAll('.navbar-nav .nav-link');
        langLinks.forEach(link => {
            const text = link.innerText.trim();
            if (text === "FR" || text === "EN") {
                let currentPath = window.location.pathname;
                let repoName = "/ousmanecisse/";

                let pathAfterRepo = "";
                if (currentPath.includes(repoName)) {
                    pathAfterRepo = currentPath.substring(currentPath.indexOf(repoName) + repoName.length);
                } else {
                    pathAfterRepo = currentPath.startsWith('/') ? currentPath.substring(1) : currentPath;
                    repoName = "/";
                }

                // Handle trailing index.html or empty path
                if (pathAfterRepo === "" || pathAfterRepo.endsWith("/")) {
                    pathAfterRepo += "index.html";
                }

                if (text === "FR") {
                    if (!pathAfterRepo.startsWith("fr/")) {
                        // We are in EN, want to go to FR
                        let targetStub = pathAfterRepo;

                        // Handle specific page renames (EN -> FR)
                        if (targetStub === "projects.html") {
                            targetStub = "projets.html";
                        }

                        link.href = repoName + "fr/" + targetStub;
                    }
                } else if (text === "EN") {
                    if (pathAfterRepo.startsWith("fr/")) {
                        // We are in FR, want to go to EN
                        let targetStub = pathAfterRepo.substring(3); // Remove "fr/"

                        // Handle specific page renames (FR -> EN)
                        if (targetStub === "projets.html") {
                            targetStub = "projects.html";
                        }

                        link.href = repoName + targetStub;
                    }
                }

                // Add error handler to redirect to home if parallel page doesn't exist
                link.addEventListener('click', function (e) {
                    // This is a simple client-side exist check might be too slow, 
                    // so we just let it 404 and maybe the user hits back, 
                    // OR we can try to fetch it.
                    // For now, let's keep it simple.
                });
            }
        });
    });
</script>
