<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Helper to determine context
        const path = window.location.pathname;
        const repoName = path.startsWith("/ousmanecisse/") ? "/ousmanecisse/" : "/";

        // Detect current language based on URL structure
        // If path contains /fr/, we assume French.
        const isFr = path.includes("/fr/");

        // 2. Determine target language and label
        // If we are in FR, button should say "EN". 
        // If we are in EN, button should say "FR".
        const targetLabel = isFr ? "EN" : "FR";

        // 3. Get translation URL from meta tag
        let translationUrl = null;
        const metaTag = document.querySelector('meta[name="translation-url"]');
        if (metaTag) {
            translationUrl = metaTag.getAttribute('content'); // use getAttribute for safety
        }

        // 4. Construct Final Target URL
        let finalUrl = "";

        if (translationUrl) {
            // Logic to prefix repoName if needed
            let cleanTransUrl = translationUrl;
            if (repoName !== "/" && !cleanTransUrl.startsWith(repoName) && !cleanTransUrl.startsWith("http")) {
                cleanTransUrl = repoName + cleanTransUrl;
                cleanTransUrl = cleanTransUrl.replace("//", "/");
            } else if (repoName === "/" && !cleanTransUrl.startsWith("/")) {
                cleanTransUrl = "/" + cleanTransUrl;
            }
            finalUrl = cleanTransUrl;
        } else {
            // FALLBACK if no metadata is found
            if (isFr) {
                // In FR -> Go to EN Home
                finalUrl = repoName === "/" ? "/index.html" : repoName + "index.html";
            } else {
                // In EN -> Go to FR Home
                finalUrl = repoName === "/" ? "/fr/index.html" : repoName + "fr/index.html";
            }
        }

        // 5. Update Navbar Link
        const langLinks = document.querySelectorAll('.navbar-nav .nav-link');
        langLinks.forEach(link => {
            const text = link.innerText.trim().toUpperCase();

            // We look for the existing placeholder "FR" or "EN"
            if (text === "FR" || text === "EN") {
                // FORCE the label to be correct based on current page context
                link.innerText = targetLabel;

                // Set the URL
                link.setAttribute('href', finalUrl);

                // Add click listener just to be safe regarding browser default behaviors/SPA router if any
                // But normally href change is enough.
                // We leave it as a standard link.
            }
        });
    });
</script>
